version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DB_PATH=/app/data/zunotwin.db
      - AI_SERVICE_URL=http://ai-service:8000
    volumes:
      - ./data:/app/data
      # Direct USB Serial access on Linux host:
      # devices:
      #   - "/dev/ttyUSB0:/dev/ttyUSB0"
    restart: unless-stopped
    depends_on:
      - ai-service

  ai-service:
    build:
      context: ./models
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    restart: unless-stopped
    depends_on:
      - backend
